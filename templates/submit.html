<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; text-align: center; padding: 50px; }
        .result-container { background: white; max-width: 500px; margin: 0 auto; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; }
        .Prediction { font-size: 24px; font-weight: bold; padding: 15px; border-radius: 4px; display: inline-block; margin-bottom: 25px; }
        .approved { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .rejected { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .back-btn { display: inline-block; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .back-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="result-container">
        <h1>Evaluation Outcome</h1>
        
        {% if prediction == 1 %}
            <div class="Prediction approved">🎉 Congratulations! Your Loan is APPROVED.</div>
        {% else %}
            <div class="Prediction rejected">❌ Sorry, Your Loan Application is REJECTED.</div>
        {% endif %}
        
        <br>
        <a href="/" class="back-btn">Test Another Profile</a>
    </div>
</body>
</html>
